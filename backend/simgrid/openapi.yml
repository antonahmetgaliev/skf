                results_url: https://staging-6.thesimgrid.com/championships/27506/results
                lobby_code_access:
                race_server_config:
                scheduled_at: false
                race_config_server_data:
                upcoming_race:
                in_progress_race:
                round_number:
                discord_url: https://discord.gg/example
                hot_lap:
                all_rounds_number: 0
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /championships/{id}/participating_users:
    get:
      tags: [Championships]
      summary: List participating users
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: A collection that is not paginated. `pagination` is null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
              example:
                data:
                - user_id: 13114
                  username: alexdriver
                  first_name: Alex
                  last_name: Driver
                  steam64_id: '12345'
                  discord_uid: uid000
                  preferred_language: english
                - user_id: 13817
                  username: jamieracer
                  first_name: Jamie
                  last_name: Racer
                  steam64_id: '12345'
                  discord_uid: uid000
                  preferred_language: italian
                pagination:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

