    get:
      tags: [Championships]
      summary: List a championship's car classes
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: A collection that is not paginated. `pagination` is null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
              example:
                data:
                - id: 144316
                  display_name: LMGT3
                  championship_id: 27506
                  capacity: 18
                  split_id:
                - id: 144317
                  display_name: LMP2 ELMS
                  championship_id: 27506
                  capacity: 12
                  split_id:
                pagination:
        '401': { $ref: '#/components/responses/Unauthorized' }

