components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A SimGrid API token, requested from your community's settings.

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 10, maximum: 500 }
      description: "Maximum records to return. Values above 500 are reduced to 500."
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
      description: "Records to skip. Use with limit to page."
  schemas:
    Pagination:
      type: object
      nullable: true
      properties:
        limit: { type: integer, example: 25 }
        offset: { type: integer, example: 0 }
        total_count: { type: integer, nullable: true, example: 240 }

    PaginatedEnvelope:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { type: object }
        pagination: { $ref: '#/components/schemas/Pagination' }

    Error:
      type: object
      properties:
        errors:
          oneOf:
            - type: string
            - type: array
              items: { type: string }

  responses:
    PaginatedCollection:
      description: A paginated collection.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }

    UnpaginatedCollection:
      description: A collection that is not paginated. `pagination` is null.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }

    SingleResource:
      description: A single resource, returned without a wrapper.
      content:
        application/json:
          schema: { type: object }

    BadRequest:
      description: The request was malformed or a required parameter was missing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    Unauthorized:
      description: The API token is missing, invalid, inactive or not yet approved.

    NotFound:
      description: The resource does not exist, or this token cannot reach it.

    UnprocessableEntity:
      description: The resource could not be found or the request could not be processed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    RateLimited:
      description: The token exceeded its per-minute or per-hour rate limit.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "Minute rate limit exceeded" }
