  /championships/{id}/registrations:
    get:
      tags: [Championships, Registrations]
      summary: List a championship's registrations
      parameters:
        - $ref: '#/components/parameters/PathId'
        - { name: page, in: query, schema: { type: integer, minimum: 1 }, description: "Page number. Omit for the unpaginated collection." }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: A paginated collection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
              example:
                data:
                - id: 1500328
                  user_id: 70638
                  registerable_id: 27506
                  registerable_type: Championship
                  championship_id: 27506
                  championship_car_class:
                    id: 144317
                    display_name: LMP2 ELMS
                    championship_id: 27506
                    capacity: 12
                    split_id:
                - id: 1500411
                  user_id: 334892
                  registerable_id: 27506
                  registerable_type: Championship
                  championship_id: 27506
                  championship_car_class:
                    id: 144316
                    display_name: LMGT3
                    championship_id: 27506
                    capacity: 18
                    split_id:
                pagination:
                  limit: 5
                  offset: 0
                  total_count: 25
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /championships/{id}/standings:
    get:
      tags: [Championships, Results]
      summary: Retrieve championship standings
      description: |
        `data` holds the paginated participant registrations. `standings` holds the
        scored standings, and `completed_races` the races counted towards them
        (rounds, on a series).
      parameters:
        - $ref: '#/components/parameters/PathId'
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
        - { name: overall, in: query, schema: { type: boolean } }
        - { name: filter_class, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Standings for the championship.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      standings: { type: array, items: { type: object } }
                      completed_races: { type: array, items: { type: object } }
                      is_series: { type: boolean }
                      grouped_results: { type: object }
                      results_per_round: { type: integer }
              example:
