  # ---------------------------------------------------------------- Races
  /races:
    get:
      tags: [Races]
      summary: List races
      parameters:
        - { name: championship_id, in: query, schema: { type: integer } }
        - { name: round_id, in: query, schema: { type: integer } }
        - { name: user_id, in: query, schema: { type: integer } }
        - { name: series, in: query, schema: { type: boolean }, description: "Filter to series or non-series races." }
        - { name: next, in: query, schema: { type: integer }, description: "Return the next n upcoming races." }
        - { name: filter, in: query, schema: { type: string, enum: [upcoming] }, description: "Used with user_id." }
        - { name: exclude_dsq, in: query, schema: { type: boolean, default: true }, description: "Exclude disqualified or retired entries." }
        - { name: order_by, in: query, schema: { type: string, enum: [starts_at, ends_at, created_at, updated_at, id] } }
        - { name: order_direction, in: query, schema: { type: string, enum: [asc, desc] } }
