openapi: 3.0.3

info:
  title: GridOS
  version: "1.0.0"
  description: |
    The SimGrid API ("GridOS") exposes sim racing data (events, results, standings, registrations and reference data) for cars, tracks and games.

    ## Authentication

    Every endpoint requires an API token, sent as a bearer token:

    ```
    Authorization: Bearer <your-token>
    ```

    Tokens are requested from your community's settings and approved by SimGrid.
    A community token is scoped to its own events and registrations.

    ## Response shape

    Endpoints that return a collection wrap it:

    ```json
    {
      "data": [ { "...": "..." } ],
      "pagination": { "limit": 25, "offset": 0, "total_count": 240 }
    }
    ```

    `pagination` is `null` when a collection is not paginated, so the key is always
    present. Endpoints that return a single resource return that object directly,
    with no wrapper.

    A few endpoints return supporting collections beside the primary one — those
    keys sit alongside `data`, and `data` is always the collection `pagination`
    counts.

    ## Pagination

    Paginated collections take `limit` and `offset`. `limit` defaults to 10 and is
    capped at 500; a larger value is silently reduced to the cap, so read
    `pagination.limit` to see what was applied and `pagination.total_count` to know
    whether more remain.

    ## Rate limits

    Limits are applied per token, per minute and per hour. Exceeding either returns
    `429` with a JSON body describing which window was hit.

servers:
  - url: https://www.thesimgrid.com/api/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Championships
  - name: Communities
  - name: Graphic Blocks
  - name: Races
  - name: Reference
  - name: Registrations
  - name: Results
  - name: Rounds
  - name: Seasons
  - name: Sponsors
  - name: Teams
  - name: Users

paths:
  # ---------------------------------------------------------------- Championships
  /championships:
    get:
      tags: [Championships]
      summary: List championships
      description: |
        Lists available events. Filter with any combination of the query parameters below.
      parameters:
        - { name: races_count, in: query, schema: { type: string, enum: [events, full_championships] }, description: "Return events with either a single race or a full championship." }
        - { name: entry_fee_required, in: query, schema: { type: boolean }, description: "Filter by free or paid events." }
        - { name: status, in: query, schema: { type: string, enum: [active, upcoming, completed] } }
        - { name: driver, in: query, schema: { type: string, enum: [solo, team] }, description: "Solo or team events." }
        - { name: grid, in: query, schema: { type: string, enum: [closed, opening, open, full] }, description: "Filter by capacity." }
        - { name: order_by, in: query, schema: { type: string }, description: "Sort by an attribute name. Always descending." }
        - { name: priority_sort, in: query, schema: { type: boolean }, description: "Use SimGrid's priority ordering. Not for use with order_by." }
        - { name: seasons, in: query, schema: { type: boolean }, description: "Only return open season championships." }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A paginated collection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
              example:
                data:
                - id: 27506
                  name: ASD DC RACING - 4FUN @ Silverstone
                - id: 25097
                  name: EKV - Open Hungaroring GT3
                pagination:
                  limit: 5
                  offset: 0
                  total_count: 2749
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /championships/{id}:
    get:
      tags: [Championships]
      summary: Retrieve a championship
      description: |
        `capacity` is the total number of slots across all splits.
        `teams_enabled` denotes whether this is a team or solo event.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: A single resource, returned without a wrapper.
          content:
            application/json:
              schema: { type: object }
              example:
                id: 27506
                name: ASD DC RACING - 4FUN @ Silverstone
                start_date: '2026-09-16T19:15:00.000Z'
                end_date:
                capacity: 35
                spots_taken: 25
                teams_enabled: false
                entry_fee_required: false
                entry_fee_cents:
                accepting_registrations: false
                allow_repeated_car_numbers: false
                races:
                - id: 266255
                  race_name: ASD DC RACING TEAM - SILVERSTONE
                  track:
                    id: 3593
                    game_id: 65
                    name: Silverstone (ELMS)
                    in_game_name: SilverstoneELMS
                    photo: https://cdn-staging.thesimgrid.com/aa24871t1a7gm27l53ykwzrhpvu4
                    parent_track_id: 3592
                    external_data:
                      scn: SilverstoneELMS
                      name: 4 Hours of Silverstone
                      settings: Silverstone
                    content_type: vanilla
                    mod_download_link:
                    track_layouts_count: 0
                    composite_name: Silverstone (ELMS)
                  starts_at: '2026-09-16T19:15:00.000Z'
                  display_name: ASD DC RACING TEAM - SILVERSTONE
                  results_available: true
                  published_at: '2026-09-16T20:56:49.613Z'
                  hot_lap: false
                  ended: true
                image: https://cdn-staging.thesimgrid.com/nqskzajpw5imeyqmmaw6m7raqbow
                host_name: DC RACING TEAM
                co_hosted: false
                game_name: Le Mans Ultimate
